name: Update Blog Content

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # 매일 자정 실행

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Update Script
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_BLOG_DATASOURCE_ID: ${{ secrets.NOTION_BLOG_DATASOURCE_ID }}
          NOTION_DATASOURCE_ID: ${{ secrets.NOTION_DATASOURCE_ID }}
        run: node update_blog.js

      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          if [[ -n $(git status --porcelain blog) ]]; then
            git add blog
            git commit -m "Auto-update: Blog content synced from Notion 🔄"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
