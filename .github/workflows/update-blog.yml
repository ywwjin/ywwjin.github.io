name: Update Blog Content

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # 매일 자정 실행

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Update Script
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_BLOG_DATASOURCE_ID: ${{ secrets.NOTION_BLOG_DATASOURCE_ID }}
          NOTION_DATASOURCE_ID: ${{ secrets.NOTION_DATASOURCE_ID }}
        run: node update_blog.js

      # main이 PR 필수 브랜치 보호 규칙이라 직접 push 대신 PR을 자동 생성/갱신함
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Auto-update: Blog content synced from Notion 🔄"
          branch: blog-content-update
          delete-branch: true
          title: "Blog content update (Notion sync)"
          body: "Notion에서 자동으로 동기화된 블로그 콘텐츠입니다. 확인 후 merge 해주세요."
